[package]
name = "native-gpui"
version = "0.1.0"
edition = "2021"
description = "Real AppKit controls, materials and macOS 26 liquid glass hosted inside a GPUI window"
license = "MIT"
publish = false

# faim: native-gpui alone. The vendored gpui_macos and Found'er stay on zed's GPUI.
[workspace]
exclude = ["crates", "founder"]

[lib]
name = "native_gpui"
path = "src/lib.rs"

[features]
default = []
# Undocumented material values and private AppKit selectors.
private-api = []

[dependencies]
# faim: gpui-fast in place of zed's GPUI (see PATCHES.md).
gpui = { package = "gpui-fast", version = "=0.1.14", default-features = false }
# faim: the pixel types only. The defaults add every codec, AVIF encoding included.
image = { version = "0.25", default-features = false }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-quick-look-ui = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-app-kit",
    "QLPreviewItem",
    "QLPreviewPanel",
] }
objc2-quick-look-thumbnailing = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "QLThumbnailGenerationRequest",
    "QLThumbnailGenerator",
    "QLThumbnailRepresentation",
] }

[dev-dependencies]
# faim: without font-kit you get NoopTextSystem and no text. The app depending on
# native-gpui turns it on the same way.
gpui_platform = { package = "gpui-fast-platform", version = "=0.1.14", features = ["font-kit"] }
parking_lot = "0.12"

[[example]]
name = "custom_glass"
path = "examples/custom_glass.rs"
required-features = ["private-api"]

[[example]]
name = "glass_variants"
path = "examples/glass_variants.rs"
required-features = ["private-api"]

[[example]]
name = "decoration_hit"
path = "probes/decoration_hit.rs"

[[example]]
name = "glass_hit"
path = "probes/glass_hit.rs"

[[example]]
name = "menu_bar"
path = "probes/menu_bar.rs"

[[example]]
name = "menu_probe"
path = "probes/menu_probe.rs"

[[example]]
name = "ngdispatch"
path = "probes/ngdispatch.rs"

[[example]]
name = "sidebar_probe"
path = "probes/sidebar_probe.rs"

[[example]]
name = "smoke"
path = "probes/smoke.rs"

[[example]]
name = "tabular_figures"
path = "probes/tabular_figures.rs"

[[example]]
name = "z_order"
path = "probes/z_order.rs"

[profile.release]
lto = false
incremental = true


[lints.clippy]
type_complexity = "allow"
